version: v1
name: buf.build/mud/epixchain
deps:
  - buf.build/cosmos/cosmos-sdk
  - buf.build/cosmos/cosmos-proto
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
lint:
  use:
    - DEFAULT
    - COMMENTS
    - FILE_LOWER_SNAKE_CASE
  except:
    - UNARY_RPC
    - COMMENT_FIELD
    - SERVICE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - COMMENT_MESSAGE
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
  # The x/precisebank module was intentionally removed during the
  # cosmos/evm v0.7.0 upgrade — Epix is 18-decimal so the wrapper module
  # serves no purpose. The deletions are recorded here so buf's
  # breaking-change check on PRs doesn't flag them every time. Once this
  # PR lands on main and main becomes the baseline, these entries can
  # be removed.
  ignore:
    - cosmos/evm/precisebank/v1/query.proto
    - cosmos/evm/precisebank/v1/genesis.proto
