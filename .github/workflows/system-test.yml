name: System Test
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
      - release/**
permissions: read-all

# Cancel superseded in-progress runs on the same ref — native replacement for
# the old cleanup-runs job. Never cancel on main or release tags.
concurrency:
  group: system-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      - name: Install Foundry (forge/cast/anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/changed-files
        with:
          patterns: |
            .github/workflows/test-system.yml
            **/**.sol
            **/**.go
            go.mod
            go.sum
            *.toml
      - name: run system tests
        run: |
          make test-system
        if: env.GIT_DIFF
