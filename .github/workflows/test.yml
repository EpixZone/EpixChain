name: Tests
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
      - release/**
permissions: read-all

# Cancel superseded in-progress runs on the same ref — a native, race-free
# replacement for the old cleanup-runs action. Never cancel on main so those
# runs always complete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-unit-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      - uses: actions/checkout@v5
        with:
          # depth 2 lets HEAD~1 resolve, used as the diff base on push events
          # where github.event.before may point at an unreachable commit
          # (e.g. after a force-push or fork resync).
          fetch-depth: 2
      - name: Resolve diff base for push events
        id: diff_base
        if: github.event_name == 'push'
        run: echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/changed-files
        with:
          base: ${{ steps.diff_base.outputs.base }}
          patterns: |
            .github/workflows/test.yml
            **/**.sol
            **/**.go
            go.mod
            go.sum
            evmd/go.mod
            evmd/go.sum
            evmd/**/**.go
            *.toml
      - name: Test and Create Coverage Report
        run: |
          make test-unit-cover
        if: env.GIT_DIFF
      - uses: codecov/codecov-action@v5
        with:
          file: ./coverage.txt
          # We were getting a 500 error on codecov servers
          # so we decided to avoid blocking the CI if this fails
          fail_ci_if_error: false
        if: env.GIT_DIFF
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Race detector on the concurrency-sensitive packages only. test-unit-cover
  # drops -race (whole-repo coverage + -race OOMs the runner), so this keeps CI
  # race coverage where it matters (streams/mempool/rpc/indexer/server) at a
  # fraction of the cost — runs in ~1 minute.
  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Resolve diff base for push events
        id: diff_base
        if: github.event_name == 'push'
        run: echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/changed-files
        with:
          base: ${{ steps.diff_base.outputs.base }}
          patterns: |
            **/**.go
            go.mod
            go.sum
      - name: Race detector (concurrency-sensitive packages)
        run: make test-race-lite
        if: env.GIT_DIFF

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Resolve diff base for push events
        id: diff_base
        if: github.event_name == 'push'
        run: echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/changed-files
        with:
          base: ${{ steps.diff_base.outputs.base }}
          patterns: |
            .github/workflows/test.yml
            ./scripts/**
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
        if: env.GIT_DIFF
      - name: Install Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
        if: env.GIT_DIFF
      - name: Test Scripts
        run: |
          make test-scripts
        if: env.GIT_DIFF

