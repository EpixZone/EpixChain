name: Solidity Test
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
      - release/**
permissions: read-all

jobs:
  test-solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
      - uses: actions/checkout@v5
        with:
          # depth 2 lets HEAD~1 resolve, used as the diff base on push events
          # where github.event.before may point at an unreachable commit.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Resolve diff base for push events
        id: diff_base
        if: github.event_name == 'push'
        run: echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/changed-files
        with:
          base: ${{ steps.diff_base.outputs.base }}
          patterns: |
            **/**.sol
            **/**.go
            go.mod
            go.sum
            *.toml
      - name: Cache yarn dependencies
        uses: actions/cache@v5
        with:
          path: tests/solidity/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('tests/solidity/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Test Solidity
        run: |
          make test-solidity
        if: env.GIT_DIFF
