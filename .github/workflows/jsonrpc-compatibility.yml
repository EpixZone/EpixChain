name: JSON-RPC Compatibility Test
on:
  pull_request:
    paths:
      - '.github/workflows/jsonrpc-compatibility.yml'
      - 'tests/jsonrpc/**'
      - 'rpc/**'
      - 'evmd/**'
      - '**/**.go'
      - 'go.mod'
      - 'go.sum'
      - 'evmd/go.mod'
      - 'evmd/go.sum'
  merge_group:
  push:
    branches:
      - main
      - release/**
permissions: read-all

# Cancel superseded in-progress runs on the same ref — native replacement for
# the old cleanup-runs job. Never cancel on main or release tags.
concurrency:
  group: jsonrpc-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  jsonrpc-compatibility-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
      
      - uses: actions/checkout@v5
        with:
          # depth 2 lets HEAD~1 resolve, used as the diff base on push events
          # where github.event.before may point at an unreachable commit.
          fetch-depth: 2

      - name: Resolve diff base for push events
        id: diff_base
        if: github.event_name == 'push'
        run: echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/changed-files
        with:
          base: ${{ steps.diff_base.outputs.base }}
          patterns: |
            .github/workflows/jsonrpc-compatibility.yml
            tests/jsonrpc/**
            rpc/**
            evmd/**
            **/**.go
            go.mod
            go.sum
            evmd/go.mod
            evmd/go.sum
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v4
        if: ${{ env.GIT_DIFF }}
      
      - name: Run JSON-RPC compatibility tests
        run: |
          echo "🧪 Running JSON-RPC compatibility tests using containerized environment..."
          
          # Run the containerized test suite
          make test-rpc-compat > test_output.log 2>&1 || {
            echo "⚠️ Test exited with non-zero code, checking results..."
          }
          
          # Display the test output
          cat test_output.log
          
          # Check for failure criterion: count of "Failed" tests > 0
          failed_count=$(grep -o "Failed:.*[0-9]" test_output.log | grep -o "[0-9]\+" | head -1 || echo "0")
          
          echo "📊 Test Results Summary:"
          echo "  Failed tests: $failed_count"
          
          if [ "$failed_count" -gt 0 ]; then
            echo "❌ CI FAILURE: Found $failed_count failed tests"
            echo "   Criterion: CI fails when any test has status 'Failed' (not 'Not Implemented', 'Legacy', or 'Skipped')"
            exit 1
          else
            echo "✅ CI PASS: No failed tests found"
            echo "   Note: 'Not Implemented', 'Legacy', and 'Skipped' tests are acceptable and don't cause CI failure"
          fi
        if: ${{ env.GIT_DIFF }}
